name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tenancy_helpdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3

      - name: Install Flyway
        run: |
          curl -L -o flyway.tar.gz https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.3/flyway-commandline-9.22.3-linux-x64.tar.gz
          tar -xzf flyway.tar.gz
          sudo ln -s $PWD/flyway-9.22.3/flyway /usr/local/bin/flyway

      - name: Run Flyway migrations
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/tenancy_helpdesk
          FLYWAY_USER: postgres
          FLYWAY_PASSWORD: password
        run: |
          flyway -configFiles=flyway.conf migrate

      - name: Run isolation demo script
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: tenancy_helpdesk
        run: |
          psql -c "\i scripts/demo_isolation.sql"

      - name: Run benchmark script
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: tenancy_helpdesk
        run: |
          psql -c "\i scripts/benchmark_rls.sql"

      - name: Run test suites
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: password
          PGDATABASE: tenancy_helpdesk
        run: |
          psql -v ON_ERROR_STOP=1 -c "\i tests/tenant_isolation.sql"
          psql -v ON_ERROR_STOP=1 -c "\i tests/jsonb_config.sql"